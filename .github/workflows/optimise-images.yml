name: Optimise website images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install image processor
        run: npm install --no-save --no-package-lock sharp
      - name: Convert images and update references
        run: node scripts/optimize-images.mjs
      - name: Commit optimised assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aswani_sales
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Optimise website images to WebP"
            git push
          fi
